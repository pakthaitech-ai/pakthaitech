name: PakThai Daily Source Audit

on:
  workflow_dispatch:
  schedule:
    # 07:00 Pakistan Standard Time (UTC+5)
    - cron: "0 2 * * *"
  push:
    branches: [main]
    paths:
      - "PakThai-Tech-AI-Sourcing-FINAL/src/**"
      - "PakThai-Tech-AI-Sourcing-FINAL/tools/**"
      - "PakThai-Tech-AI-Sourcing-FINAL/package.json"
      - "PakThai-Tech-AI-Sourcing-FINAL/package-lock.json"
      - ".github/workflows/**"

permissions:
  contents: read

concurrency:
  group: pakthai-source-audit
  cancel-in-progress: true

jobs:
  audit:
    name: Tests and dependency security audit
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 30
    defaults:
      run:
        working-directory: source/PakThai-Tech-AI-Sourcing-FINAL
        shell: powershell
    steps:
      - name: Clone source into isolated runner workspace
        working-directory: .
        timeout-minutes: 10
        run: |
          $git = 'C:\Program Files\Git\cmd\git.exe'
          $source = Join-Path $env:GITHUB_WORKSPACE 'source'
          $env:GIT_TERMINAL_PROMPT = '0'
          Write-Output "Runner identity: $([Security.Principal.WindowsIdentity]::GetCurrent().Name)"
          Write-Output "Source staging path: $source"
          if (Test-Path $source) { Get-ChildItem $source -Force | Remove-Item -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $source | Out-Null
          & $git -c http.sslBackend=openssl -c core.longpaths=true clone --filter=blob:none --no-checkout --depth 1 --single-branch --branch main https://github.com/pakthaitech-ai/pakthaitech.git $source
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $patterns = @(
            '/.github/workflows/',
            '/PakThai-Tech-AI-Sourcing-FINAL/',
            '!/PakThai-Tech-AI-Sourcing-FINAL/_MASTER_CONTROL/snapshot/',
            '/PakThai-Store-DEPLOY/'
          )
          $patterns | & $git -c http.sslBackend=openssl -c core.longpaths=true -C $source sparse-checkout set --no-cone --stdin
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $git -c http.sslBackend=openssl -c core.longpaths=true -C $source checkout --detach HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $head = & $git -c safe.directory=* -C $source rev-parse HEAD
          Write-Output "Checked out main at $head; workflow trigger was $env:GITHUB_SHA"

      - name: Confirm Node.js and npm
        run: |
          & 'C:\Program Files\nodejs\node.exe' --version
          & 'C:\Program Files\nodejs\npm.cmd' --version

      - name: Install locked dependencies
        id: install
        run: |
          & 'C:\Program Files\nodejs\npm.cmd' ci --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run project test suite
        run: |
          & 'C:\Program Files\nodejs\npm.cmd' test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run production dependency audit
        if: always() && steps.install.outcome == 'success'
        run: |
          & 'C:\Program Files\nodejs\npm.cmd' audit --omit=dev --audit-level=moderate
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run complete dependency audit
        if: always() && steps.install.outcome == 'success'
        run: |
          $env:PATH = 'C:\Program Files\nodejs;' + $env:PATH
          $report = Join-Path $env:RUNNER_TEMP "pakthai-npm-audit-full-$env:GITHUB_RUN_NUMBER.json"
          cmd.exe /c "npm audit --json > `"$report`""
          $auditExit = $LASTEXITCODE
          & 'C:\Program Files\nodejs\node.exe' -e "const p=JSON.parse(require('node:fs').readFileSync(process.argv[1],'utf8')); console.log(JSON.stringify(p.metadata?.vulnerabilities ?? {},null,2));" "$report"
          $nodeExit = $LASTEXITCODE
          if ($nodeExit -ne 0) { exit $nodeExit }
          Write-Output "Full audit JSON saved to $report"
          if ($auditExit -ne 0) { exit $auditExit }
