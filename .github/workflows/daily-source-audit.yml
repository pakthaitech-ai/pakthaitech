name: PakThai Daily Source Audit

on:
  workflow_dispatch:
  schedule:
    # 07:00 Pakistan Standard Time (UTC+5)
    - cron: "0 2 * * *"
  push:
    branches: [main]
    paths:
      - "PakThai-Tech-AI-Sourcing-FINAL/src/**"
      - "PakThai-Tech-AI-Sourcing-FINAL/tools/**"
      - "PakThai-Tech-AI-Sourcing-FINAL/package.json"
      - "PakThai-Tech-AI-Sourcing-FINAL/package-lock.json"
      - ".github/workflows/**"

permissions:
  contents: read

concurrency:
  group: pakthai-source-audit
  cancel-in-progress: true

jobs:
  audit:
    name: Tests and dependency security audit
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 30
    defaults:
      run:
        working-directory: source/PakThai-Tech-AI-Sourcing-FINAL
        shell: powershell
    steps:
      - name: Clone source into isolated runner workspace
        working-directory: .
        timeout-minutes: 10
        run: |
          $git = 'C:\Program Files\Git\cmd\git.exe'
          $workspace = 'C:\actions-runner\_work\pakthaitech\pakthaitech'
          $source = Join-Path $workspace 'source'
          $diag = 'C:\actions-runner\_work\_temp\pakthai-clone-step.log'
          "Started: $(Get-Date -Format o)" | Out-File -FilePath $diag -Encoding utf8
          "GITHUB_WORKSPACE=$env:GITHUB_WORKSPACE" | Add-Content -Path $diag
          "RUNNER_TEMP=$env:RUNNER_TEMP" | Add-Content -Path $diag
          "Current directory=$((Get-Location).Path)" | Add-Content -Path $diag
          "Workspace exists=$(Test-Path $workspace)" | Add-Content -Path $diag
          "Git exists=$(Test-Path $git)" | Add-Content -Path $diag
          "Node exists=$(Test-Path 'C:\Program Files\nodejs\node.exe')" | Add-Content -Path $diag
          try {
            $env:GIT_TERMINAL_PROMPT = '0'
            if (Test-Path $source) { Get-ChildItem $source -Force | Remove-Item -Recurse -Force }
            New-Item -ItemType Directory -Force -Path $source | Out-Null
            "Clone starting: $source" | Add-Content -Path $diag
            & $git -c http.sslBackend=openssl -c core.longpaths=true clone --filter=blob:none --no-checkout --depth 1 --single-branch --branch main https://github.com/pakthaitech-ai/pakthaitech.git $source 2>&1 | Tee-Object -FilePath $diag -Append
            $exit = $LASTEXITCODE
            "Clone exit=$exit" | Add-Content -Path $diag
            if ($exit -ne 0) { throw "Git clone failed with exit code $exit." }
            $patterns = @(
              '/.github/workflows/',
              '/PakThai-Tech-AI-Sourcing-FINAL/',
              '!/PakThai-Tech-AI-Sourcing-FINAL/_MASTER_CONTROL/snapshot/',
              '/PakThai-Store-DEPLOY/'
            )
            $patterns | & $git -c http.sslBackend=openssl -c core.longpaths=true -C $source sparse-checkout set --no-cone --stdin 2>&1 | Tee-Object -FilePath $diag -Append
            $exit = $LASTEXITCODE
            "Sparse checkout exit=$exit" | Add-Content -Path $diag
            if ($exit -ne 0) { throw "Sparse checkout failed with exit code $exit." }
            & $git -c http.sslBackend=openssl -c core.longpaths=true -C $source checkout --detach HEAD 2>&1 | Tee-Object -FilePath $diag -Append
            $exit = $LASTEXITCODE
            "Git checkout exit=$exit" | Add-Content -Path $diag
            if ($exit -ne 0) { throw "Git checkout failed with exit code $exit." }
            $head = & $git -c safe.directory=* -C $source rev-parse HEAD
            "Checked out HEAD=$head; workflow SHA=$env:GITHUB_SHA" | Add-Content -Path $diag
            Write-Output "Source clone and sparse checkout complete at $head."
          } catch {
            $_ | Out-String | Add-Content -Path $diag
            throw
          }

      - name: Confirm Node.js and npm
        run: |
          & 'C:\Program Files\nodejs\node.exe' --version
          & 'C:\Program Files\nodejs\npm.cmd' --version

      - name: Install locked dependencies
        id: install
        run: |
          & 'C:\Program Files\nodejs\npm.cmd' ci --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run project test suite
        run: |
          & 'C:\Program Files\nodejs\npm.cmd' test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run production dependency audit
        if: always() && steps.install.outcome == 'success'
        run: |
          & 'C:\Program Files\nodejs\npm.cmd' audit --omit=dev --audit-level=moderate
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run complete dependency audit
        if: always() && steps.install.outcome == 'success'
        run: |
          $env:PATH = 'C:\Program Files\nodejs;' + $env:PATH
          $report = Join-Path $env:RUNNER_TEMP "pakthai-npm-audit-full-$env:GITHUB_RUN_NUMBER.json"
          cmd.exe /c "npm audit --json > `"$report`""
          $auditExit = $LASTEXITCODE
          & 'C:\Program Files\nodejs\node.exe' -e "const p=JSON.parse(require('node:fs').readFileSync(process.argv[1],'utf8')); console.log(JSON.stringify(p.metadata?.vulnerabilities ?? {},null,2));" "$report"
          $nodeExit = $LASTEXITCODE
          if ($nodeExit -ne 0) { exit $nodeExit }
          Write-Output "Full audit JSON saved to $report"
          if ($auditExit -ne 0) { exit $auditExit }
