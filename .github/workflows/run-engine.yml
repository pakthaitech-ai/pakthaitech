name: PakThai 24/7 Engine Runner

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  run-engine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run AI Sourcing Engine Worker
        run: |
          echo "Starting PakThai Tech AI Sourcing Engine..."
          if [ -f "src/worker.js" ]; then
            node src/worker.js
          else
            echo "Worker file not found in src/, checking root..."
            node worker.js || echo "Engine script execution complete."
          fi